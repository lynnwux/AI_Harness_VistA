<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decide — Legacy Capability → Development Spec</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b24; --panel2:#1b2430; --edge:#26303d;
    --ink:#e6edf3; --dim:#8b98a5; --faint:#5b6672;
    --accent:#3d9cf5; --accent2:#7ee787; --warn:#f0a020; --question:#ff6b5e; --purple:#bc8cff;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 16px;flex-wrap:wrap;
    background:linear-gradient(180deg,#182029,#10161d);border-bottom:1px solid var(--edge)}
  header .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#3d9cf5,#1f6feb);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
  header h1{font-size:14px;margin:0;font-weight:650}
  header .sub{color:var(--dim);font-size:11.5px}
  header .sp{flex:1}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:7px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--edge)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}

  .stage{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 50px)}
  .pane{min-height:0;overflow-y:auto;padding:14px 16px 60px}
  .pane.left{border-right:1px solid var(--edge)}
  .pane-title{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin:0 0 12px}
  .pane-title .prog{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim);font-size:11px}

  /* categories */
  .cat{margin-bottom:16px}
  .cat-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink);
    padding:6px 0;border-bottom:1px solid var(--edge);margin-bottom:8px}
  .cat-h .ic{font-size:13px}
  .cat-h .n{color:var(--faint);font-weight:600;font-size:11px}
  .cat.oq .cat-h{color:var(--question)}

  .row{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:9px 11px;margin-bottom:8px}
  .row.block{border-color:var(--question);box-shadow:0 0 0 1px rgba(255,107,94,.25)}
  .row .lbl{font-size:12.5px;font-weight:600}
  .row .lbl .warni{color:var(--question);margin-right:5px}
  .row .sub{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:2px;word-break:break-word}
  .seg{display:inline-flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .opt{background:var(--panel2);color:var(--dim);border:1px solid var(--edge);border-radius:6px;
    padding:3px 9px;font-size:11px;cursor:pointer;font-family:var(--sans)}
  .opt:hover{color:var(--ink)}
  .opt.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
  .cat.oq .opt.active{background:var(--question);border-color:var(--question);color:#1a0d0b}
  .oqp{width:100%;margin-top:8px;background:#0e141b;color:var(--ink);border:1px solid var(--edge);
    border-radius:6px;padding:7px 9px;font-size:12px;font-family:var(--sans);resize:vertical;min-height:34px}
  .oqp::placeholder{color:var(--faint)}
  .hintline{font-size:10.5px;color:var(--faint);margin-top:5px}
  .seg.scope{margin-top:6px}
  .scopt{background:transparent;color:var(--dim);border:1px dashed var(--edge);border-radius:6px;padding:3px 9px;font-size:10.5px;cursor:pointer;font-family:var(--sans)}
  .scopt:hover{color:var(--ink)}
  .scopt.active{background:var(--accent2);border-style:solid;border-color:var(--accent2);color:#04121f;font-weight:700}
  .intbox{margin-top:8px;padding:8px 9px;background:#0e141b;border:1px solid var(--edge);border-left:3px solid var(--purple);border-radius:6px}
  .intbox .intf{width:100%;margin-top:5px;background:#141b24;color:var(--ink);border:1px solid var(--edge);border-radius:5px;padding:5px 8px;font-size:11.5px;font-family:var(--mono)}
  .intbox .intf::placeholder{color:var(--faint)}

  /* spec doc (right) */
  .doc{font-size:12.5px;line-height:1.6}
  .doc h2{font-size:15px;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--edge)}
  .doc h2:first-child{margin-top:0}
  .doc h3{font-size:12.5px;margin:12px 0 5px;color:var(--accent)}
  .doc ul{margin:4px 0 8px;padding-left:18px}
  .doc li{margin-bottom:4px}
  .doc code{font-family:var(--mono);font-size:11.5px;background:#0e141b;border:1px solid var(--edge);border-radius:4px;padding:0 4px;color:#9ecbff}
  .doc pre{background:#0e141b;border:1px solid var(--edge);border-radius:7px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:11px;color:#c9d3dd}
  .doc .block{background:#2a1713;border:1px solid var(--question);border-radius:8px;padding:9px 12px;color:#ffb3aa}
  .doc .ok{color:var(--accent2)}
  .doc .muted{color:var(--faint)}
  .doc mark.hl{background:#3a2f14;color:#f0c040;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;vertical-align:middle;border:1px solid #6b5a1e}

  /* chat assistant (served mode) */
  .chat-fab{position:fixed;right:18px;bottom:18px;z-index:40;display:none;
    background:var(--accent);color:#04121f;border:none;border-radius:22px;padding:10px 16px;
    font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .chat-drawer{position:fixed;right:18px;bottom:18px;z-index:41;width:380px;max-width:calc(100vw - 36px);
    height:520px;max-height:calc(100vh - 90px);display:none;flex-direction:column;
    background:var(--panel);border:1px solid var(--edge);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
  .chat-drawer.open{display:flex}
  .chat-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#131b24;border-bottom:1px solid var(--edge)}
  .chat-hd b{font-size:13px}.chat-hd .m{font-size:10px;color:var(--faint);font-family:var(--mono)}
  .chat-hd .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
  .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  .cmsg{max-width:88%;padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
  .cmsg.user{align-self:flex-end;background:var(--accent);color:#04121f}
  .cmsg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--edge)}
  .cmsg.muted{color:var(--faint)}
  .chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--edge)}
  .chat-in input{flex:1;background:#0e141b;color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:var(--sans)}
  .chat-in button{background:var(--accent);color:#04121f;border:none;border-radius:8px;padding:0 13px;font-weight:700;cursor:pointer}
  .chat-hint{padding:0 12px 8px;font-size:10.5px;color:var(--faint)}
  /* chat-primary left pane */
  .pane.left.chatpane{display:flex;flex-direction:column;padding:0}
  .pane.left.chatpane .pane-title{padding:14px 16px 10px;margin:0;border-bottom:1px solid var(--edge)}
  .agenda{padding:7px 16px;border-bottom:1px solid var(--edge);font-size:11px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;background:#10161d}
  .agenda b{color:var(--ink);font-weight:700}
  .agenda .blk{color:var(--question);font-weight:700}
  .agenda .rdy{color:var(--accent2);font-weight:700}
  .chatpane .chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:#0a0e14}
  .chatpane .chat-in{padding:12px 14px;background:#10161d}
  .cmsg{max-width:90%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .cmsg::before{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
  .cmsg.user{align-self:flex-end;background:linear-gradient(180deg,#4aa6ff,#2b8ae6);color:#04121f}
  .cmsg.user::before{content:"You";color:#053; opacity:.55}
  .cmsg.assistant{align-self:flex-start;background:#1f2b3a;border:1px solid #3d5170;border-left:3px solid var(--accent);color:#f0f6fc}
  .cmsg.assistant::before{content:"Assistant";color:#66d9ff}
  .cmsg.muted{background:transparent;border:none;box-shadow:none;color:var(--faint);font-size:12px}
  .cmsg.muted::before{content:""}
  .cmsg b{color:#fff}
  .cmsg.user b{color:#001b33}
  .cmsg code{font-family:var(--mono);font-size:11.5px;background:#0a0e14;border:1px solid #3d5170;border-radius:4px;padding:0 4px;color:#9ecbff}
  .cmsg.user code{background:rgba(0,0,0,.18);border-color:transparent;color:#001b33}
  .cmsg{position:relative}
  .ttsbtn{position:absolute;top:6px;right:8px;background:transparent;border:none;cursor:pointer;font-size:12px;opacity:.5;padding:0;line-height:1}
  .ttsbtn:hover{opacity:1}
  .vsel{max-width:200px;font-size:11.5px;padding:6px 8px;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:7px;cursor:pointer}
  .voicebar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--edge)}
  .voicebar .btn{font-size:11.5px;padding:5px 10px}
  .cmsg.speaking{outline:2px solid var(--accent2);outline-offset:1px}

</head>
<body>
<header>
  <div class="logo">SE</div>

</header>

<div class="stage">

  </div>
  <div class="pane right">

    <div class="doc" id="doc"></div>

</div>

];

function defaultFor(cat,item){
  if(cat.key==="oq")   return "Defer";
  if(cat.key==="rule") return "Preserve";
  if(cat.key==="beh")  return item.id==="SIDE.Bulletin" ? "Event" : "Business Operation";
  if(cat.key==="sec")  return "Require (auth)";
  if(cat.key==="data") return "Include";
  if(cat.key==="dep")  return /FileMan|DIC|DIE|DIQ|DIR|XLFSTR|ENUTL|ENJ/.test(item.target||item.id) ? "Platform (reuse)" : "Integration";
  return cat.opts[0];
}

function isBlocking(id){
  // blocking until a resolution is recorded — a Defer chosen in the chat records its reason, so it never blocks
  const cat = CATS.find(c=>c.key==="oq"); if(!cat) return false;
  if(!cat.items(G).some(i=>i.id===id)) return false;
  return !((oqPolicy[id]||"").trim());
}
function blockingList(){
  return (cap(G).openQuestions||[]).filter(q=>isBlocking(q.id));
}

  L.push(`- Validation is DEVELOPER-REVIEWED, not assumed — see "Input requirements & validation" below. Server (FileMan) remains the source of truth.`);
  // --- Input requirements & validation (from DD + routine), flagged for review ---
  const ff=dataFields.filter(d=>d.field!==".01");
  L.push("");
  L.push(`## Phase 1 · Input requirements & validation ==developer review==`);
  L.push(`What the legacy actually enforces — at the DD (field definition) and routine (runtime) level. **Confirm whether the modern app should keep each, tighten it under current regulation/policy, or relax it. None of this is auto-applied.**`);
  const req=ff.filter(d=>d.required);
  L.push(`- **Required (DD):** ${req.length?req.map(d=>d.name).join(", "):"none — every operator field is optional at the DD level (ENTRY NUMBER is system-allocated). Making any field mandatory is a modern-policy choice."}`);
  const lenF=ff.map(d=>{const m=/\((\d+)\s*-\s*(\d+)\)/.exec(d.type||"");return m?`${d.name} ${m[1]}–${m[2]}`:null;}).filter(Boolean);
  if(lenF.length) L.push(`- **Length bounds (DD):** ${lenF.join("; ")}.`);
  const enumF=ff.filter(d=>d.enumValues); if(enumF.length) L.push(`- **Set-of-codes — value must be one of the listed options:** ${enumF.map(d=>d.name).join(", ")}.`);
  const ptrF=ff.filter(d=>d.pointsTo); if(ptrF.length) L.push(`- **Pointer — must resolve to a real entry:** ${ptrF.map(d=>d.name+" → "+String(d.pointsTo).split(" ")[0]).join(", ")}.`);
  const dateF=ff.filter(d=>/date/i.test(d.name)||/Date/.test(d.type||"")); if(dateF.length) L.push(`- **Dates — FileMan date validity:** ${dateF.map(d=>d.name).join(", ")}.`);
  const serialF=ff.find(d=>d.id==="FLD.serial"); if(serialF&&serialF.legacyInput) L.push(`- **SERIAL (routine \`ASKSER\`):** ${serialF.legacyInput}`);
  L.push(`- **Modern validation = your call.** e.g. should SERIAL become *required* and/or *hard-unique* (the legacy is neither)? should any optional field be mandatory under current policy? The legacy behavior above is the baseline to review, not a mandate.`);
  L.push("");
  L.push(`## Phase 1 · Look & feel (design system)`);
  L.push(`Adopt the **U.S. Web Design System (USWDS v3) with the VA.gov theme** — this is a federal VA application, so the visual language must match VA.gov (reference: the Million Veteran Program site). Recommended: the \`@department-of-veterans-affairs/component-library\` (VA design system) or \`@uswds/uswds\` for tokens + components.`);
  L.push(`- **Color tokens:** header/footer band navy \`#112e51\`; accent section band blue \`#2a5599\` (lighter \`#4a6ba5\`); primary action (buttons/links) \`#0071bc\`, hover/active \`#205493\`; page background \`#f1f1f1\`; content surfaces white \`#ffffff\`; ink \`#1b1b1b\`, muted \`#5b616b\`, borders \`#d6d7d9\`; crisis/error red \`#e31c3d\`.`);
  L.push(`- **Typography:** serif headings (\`Bitter\` / \`Merriweather\`), sans body (\`Source Sans Pro\`); base 16–17px, line-height 1.5; bold section headings.`);
  L.push(`- **Layout:** centered container (max-width ~1000px); top utility bar (Contact Us / Sign In) → navy primary nav → content in alternating white / blue section bands; white cards with 1px \`#d6d7d9\` border + subtle shadow; generous vertical rhythm.`);
  L.push(`- **App shell:** keep it minimal — just a navy app header showing the app title. Do NOT add a VA masthead/"official website" strip, a crisis-line banner, footer link columns, or a contact/phone block; this is an internal data-entry tool, only the VA visual language (color, type, components) is wanted.`);
  L.push(`- **Form components (USWDS):** labels **bold, above** each control; large inputs (≥44px touch target), 2px border, focus ring \`#0071bc\`; wizard steps → USWDS **Step indicator** (numbered, current highlighted); primary Next/Submit = solid primary button, Back = outline button; lookup combobox / left-rail → USWDS **combo box**, enum selects → USWDS **dropdown**; confirmation → USWDS **Summary box**; success → green alert, errors → red alert.`);
  L.push(`- **Accessibility:** Section 508 / WCAG 2.1 AA — semantic landmarks, every control labeled, visible focus, ≥4.5:1 text contrast, fully keyboard-navigable wizard and lookups.`);
  L.push("");
  // Pointer/lookup values are NOT dumped in-spec — each field line shows one example;
  // the built app fetches the full list at runtime via GET /lookup/{file}?q= (with &all=1
  // to populate a small dropdown). Full lists live in the sandbox, not the spec.
  L.push(`## Acceptance criteria — differential vs. legacy`);
  L.push(`- Creates a record in \`^ENG(6914)\` with a new IEN (next-IEN = \`$P(^ENG(6914,0),"^",3)+1\`).`);
  if(dataFields.some(d=>d.id==="FLD.serial")) L.push(`- Files SERIAL (field 5) and maintains the \`F\` + \`FC\` cross-references; \`FC\` uses the canonicalized serial (UPPERCASE, punctuation stripped, 30 chars) for duplicate detection.`);
  ops.concat(ev).forEach(b=> L.push(`- ${b.name} occurs per its disposition (${dec[b.id]}).`));
  rules.filter(r=>dec[r.id]==="Preserve").forEach(r=> L.push(`- Rule holds: ${r.condition}.`));
  L.push(`- Given identical sandbox input, target output & state match the legacy option on all of the above.`);
  L.push("");
  L.push(`## Traceability`);
  L.push(`- \`${TARGET}\` ← ${c.id}, ${c.entryPoint?c.entryPoint.id:""}, ${c.entryPoint?c.entryPoint.dispatch:""}`);
  ops.forEach(b=> L.push(`- \`Op.${b.name.replace(/[^A-Za-z0-9]/g,"")}\` ← ${b.id}${b.candidateCapability?(" ("+b.candidateCapability+")"):""}`));
  return L.join("\n");
}

/* tiny markdown -> html */
function mdToHtml(md){
  const lines=md.split("\n"); let h="", inUl=false, inPre=false;
  const closeUl=()=>{ if(inUl){h+="</ul>";inUl=false;} };
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/==([^=]+)==/g,'<mark class="hl">$1</mark>');
  lines.forEach(ln=>{
    if(ln.trim()==="```"){ if(inPre){h+="</pre>";inPre=false;} else {closeUl();h+="<pre>";inPre=true;} return; }
    if(inPre){ h+=esc(ln)+"\n"; return; }
    if(ln.startsWith("### ")){ closeUl(); h+=`<h3>${inline(ln.slice(4))}</h3>`; return; }
    if(ln.startsWith("## ")){ closeUl(); h+=`<h2>${inline(ln.slice(3))}</h2>`; return; }
    if(ln.startsWith("# ")){ closeUl(); h+=`<h2 style="font-size:17px">${inline(ln.slice(2))}</h2>`; return; }
    if(ln.startsWith("- ")||ln.startsWith("  - ")){ if(!inUl){h+="<ul>";inUl=true;} const ind=ln.startsWith("  - "); h+=`<li${ind?' style="margin-left:16px"':''}>${inline(ln.replace(/^\s*- /,""))}</li>`; return; }
    closeUl();
    if(ln.trim()===""){ h+=""; return; }
    if(ln.startsWith("🚫")||ln.startsWith("Source:")){ h+=`<p class="muted">${inline(ln)}</p>`; return; }
    h+=`<p>${inline(ln)}</p>`;
  });
  closeUl(); if(inPre)h+="</pre>";
  // highlight blocking header section
  return h;
}
function renderRight(){ document.getElementById("doc").innerHTML = mdToHtml(specMD()); updateProg(); updateAgenda(); }
function updateAgenda(){
  const el=document.getElementById("agenda"); if(!el) return;
  const c=cap(G), oqs=c.openQuestions||[], beh=c.sideEffects||[];
  const resolved=oqs.filter(q=>!isBlocking(q.id)).length;
  const deferred=beh.filter(b=>(scope[b.id]||"Build now")==="Defer").length;
  const integ=beh.filter(b=>dec[b.id]==="Integration").length;
  const dropped=beh.filter(b=>dec[b.id]==="Drop").length;
  const blk=blockingList().length;
  el.innerHTML =
    `<span>Open questions <b>${resolved}/${oqs.length}</b> resolved</span>`
    + `<span>Side effects <b>${beh.length}</b>${deferred?` · ${deferred} deferred`:""}${integ?` · ${integ} integration`:""}${dropped?` · ${dropped} dropped`:""}</span>`
    + (blk?`<span class="blk">⚠ ${blk} blocking — resolve to build</span>`:`<span class="rdy">✓ ready to build</span>`);
}
/* natural-language explanation of the capability graph — the orientation before deciding */
function capabilityOverview(){
  const c=cap(G), w=G.workflow;
  const fileNode=(c.data||[]).find(d=>d.file); const file=fileNode?fileNode.file:"6914";
  const entryScreens=(c.formScreens||[]).filter(s=>s.fields&&s.fields.length);
  const screens=entryScreens.length;
  const fields=entryScreens.reduce((n,s)=>n+s.fields.length,0) || (c.data||[]).filter(d=>d.kind==="field").length;
  const beh=(c.sideEffects||[]); const oqs=(c.openQuestions||[]);
  const sfx=beh.map(b=>b.name).join(", ");
  const menu=(w.menuPath||[]).join(" ▸ ");
  const paras=[];
  paras.push(`**What we're building: \`${TARGET}\`** — the modern version of the legacy **${w.name}** option (routine \`${c.entryPoint?c.entryPoint.dispatch:""}\`, FileMan file ${file}).`+(menu?` Discovered by tracing ${menu}.`:""));
  if(c.summary) paras.push(c.summary);
  paras.push(`In plain terms: a clerk fills a **${screens}-screen form (${fields} fields)**; on save the record is created in file ${file} with its serial-number duplicate check preserved. The entry also triggers **${beh.length} downstream side effects** — ${sfx}.`);
  paras.push(`We'll turn this into a build spec targeting **Angular → REST → IRIS Interop → AI Hub** (it renders live on the right). Most of the capability is coded and carries over automatically; the legacy leaves **${oqs.length} decisions to a human**, plus how each side effect is wired. Let's settle those.`);
  return paras.join("\n\n");
}

/* ---------- state + events ---------- */
const SERVED = location.protocol === "http:" || location.protocol === "https:";
function persist(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({dec,oqPolicy,scope,integration})); }catch(e){}
  if(SERVED){ fetch("/api/decisions",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({dec,oqPolicy,scope,integration})}).catch(()=>{}); }
}

/* ---- chat assistant (served mode) ---- */
let chatHistory=[];
function fmtMsg(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>"); }

/* ---------- text-to-speech (Web Speech API) ---------- */
let voiceOn = ('speechSynthesis' in window);
function stripForSpeech(t){
  return String(t)
    .replace(/```[\s\S]*?```/g," (code) ")
    .replace(/[*_`#>|]/g,"")
    .replace(/[①②③④⑤⑥⑦⑧⑨]/g,"")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu," ")
    .replace(/[→▸·•]/g," , ")
    .replace(/\s+/g," ").trim();
}
let speakingEl=null, voices=[], chosenVoice=null;
function scoreVoice(v){
  let s=0; const n=(v.name||"").toLowerCase();
  if(/^en/i.test(v.lang)) s+=3;
  if(/natural|neural|online/.test(n)) s+=6;      // MS Edge neural voices
  if(/google/.test(n)) s+=4;                      // Chrome's cloud voice
  if(/aria|jenny|guy|ana|michelle|siri|samantha|serena|zoe/.test(n)) s+=3;
  if(/david|zira|mark|hazel|espeak|pico/.test(n)) s-=3;  // old robotic
  if(v.localService===false) s+=1;                // cloud usually nicer
  return s;
}
function loadVoices(){
  voices=(window.speechSynthesis?speechSynthesis.getVoices():[])||[];
  const sel=document.getElementById("voiceSel"); if(!sel) return;
  if(!voices.length){ sel.innerHTML='<option>loading voices…</option>'; return; }
  const ranked=voices.map((v,i)=>({v,i,s:scoreVoice(v)})).sort((a,b)=>b.s-a.s);
  const saved=localStorage.getItem("decideVoice");
  chosenVoice = (saved && voices.find(v=>v.name===saved)) || ranked[0].v;
  sel.innerHTML=ranked.map(({v})=>`<option value="${esc(v.name)}" ${v.name===chosenVoice.name?"selected":""}>${esc(v.name)}${/natural|neural|online|google/i.test(v.name)?" ★":""}</option>`).join("");
}
function speak(text, el){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    if(speakingEl) speakingEl.classList.remove("speaking");
    const u=new SpeechSynthesisUtterance(stripForSpeech(text)); u.rate=1.03; u.pitch=1.0;
    if(chosenVoice){ u.voice=chosenVoice; u.lang=chosenVoice.lang; }
    if(el){ speakingEl=el; el.classList.add("speaking"); u.onend=u.onerror=()=>el.classList.remove("speaking"); }
    speechSynthesis.speak(u);
  }catch(e){}
}
function addMsg(role,text,cls){
  const box=document.getElementById("chatMsgs");
  const d=document.createElement("div"); d.className="cmsg "+role+(cls?(" "+cls):"");
  if(role==="assistant"&&!cls){
    d.innerHTML=fmtMsg(text);
    const rb=document.createElement("button"); rb.className="ttsbtn"; rb.title="Play aloud"; rb.textContent="🔊";
    rb.onclick=()=>speak(text,d); d.appendChild(rb);
    if(voiceOn) speak(text,d);
  } else { d.textContent=text; }
  box.appendChild(d); box.scrollTop=box.scrollHeight; return d;
}
async function sendChat(){
  const inp=document.getElementById("chatInp"); const msg=inp.value.trim(); if(!msg) return;
  inp.value=""; addMsg("user",msg); const prior=chatHistory.slice(); chatHistory.push({role:"user",text:msg});
  const pending=addMsg("assistant","…","muted");
  try{
    const r=await fetch("/api/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,history:prior})});
    const res=await r.json(); pending.remove();
    if(res.error){ addMsg("assistant","⚠ "+res.error); return; }
    addMsg("assistant",res.reply); chatHistory.push({role:"assistant",text:res.reply});
    if(res.decisions&&res.decisions.dec){ dec=res.decisions.dec; oqPolicy=res.decisions.oqPolicy||{}; scope=res.decisions.scope||scope; integration=res.decisions.integration||integration; renderRight(); }
  }catch(e){ pending.remove(); addMsg("assistant","⚠ "+e.message); }
}
function wireChat(){
  document.getElementById("chatSend").onclick=sendChat;
  document.getElementById("chatInp").addEventListener("keydown",e=>{ if(e.key==="Enter") sendChat(); });
  const vb=document.getElementById("voiceBtn");
  if(!('speechSynthesis' in window)){ vb.disabled=true; vb.textContent="🔇 (no TTS)"; voiceOn=false; return; }
  vb.onclick=()=>{ voiceOn=!voiceOn; if(!voiceOn){ speechSynthesis.cancel(); if(speakingEl)speakingEl.classList.remove("speaking"); } vb.textContent=voiceOn?"🔊 Voice":"🔇 Muted"; vb.classList.toggle("primary",voiceOn); };
  vb.classList.toggle("primary",voiceOn);
  loadVoices();
  try{ speechSynthesis.addEventListener("voiceschanged",loadVoices); }catch(e){}
  if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
  // getVoices() is async in some browsers — retry until the list populates
  let vtries=0; const viv=setInterval(()=>{ loadVoices(); if(voices.length || ++vtries>12) clearInterval(viv); },300);
  const sel=document.getElementById("voiceSel");
  sel.onchange=()=>{ chosenVoice=voices.find(v=>v.name===sel.value)||chosenVoice; if(chosenVoice) localStorage.setItem("decideVoice",chosenVoice.name); speak("Voice set to "+ (chosenVoice?chosenVoice.name:"default")+".", null); };
}
function restore(){ try{ const s=JSON.parse(localStorage.getItem(LSKEY)||"{}"); if(s.dec)dec=s.dec; if(s.oqPolicy)oqPolicy=s.oqPolicy; if(s.scope)scope=s.scope; if(s.integration)integration=s.integration; }catch(e){} }

document.getElementById("dlBtn").onclick=()=>{
  const blob=new Blob([specMD()],{type:"text/markdown"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="spec.md"; a.click();
};
document.getElementById("buildBtn").onclick=async ()=>{
  const btn=document.getElementById("buildBtn"); const kill=document.getElementById("killBtn"); const label=btn.textContent;
  const reset=()=>{ btn.textContent=label; btn.disabled=false; kill.disabled=true; kill.textContent="⏹ Stop"; };
  btn.textContent="🔨 Building…"; btn.disabled=true; kill.disabled=false;
  // a live progress bubble (created manually so it isn't auto-spoken on every poll tick)
  const boxEl=document.getElementById("chatMsgs");
  const bubble=document.createElement("div"); bubble.className="cmsg assistant"; boxEl.appendChild(bubble);
  const upd=(html)=>{ bubble.innerHTML=html; boxEl.scrollTop=boxEl.scrollHeight; };
  const pre=(t)=>`<pre style="margin-top:6px;max-height:170px;overflow:auto;background:#0a0e14;border:1px solid var(--edge);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap">${esc(t)}</pre>`;
  const fmt=(n)=>{ n=Math.max(0,Math.round(n||0)); const m=Math.floor(n/60), s=n%60; return m?(m+"m "+s+"s"):(s+"s"); };
  const bar=(s)=>{ const pct=Math.round(s.pct||0); return `<div style="background:#26303d;border-radius:6px;height:12px;margin:8px 0;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent2);transition:width .5s"></div></div><div style="font-size:11px;color:var(--dim)">${pct}%${s.elapsedSec!=null?" · "+fmt(s.elapsedSec)+" elapsed":""}${s.etaSec!=null&&s.state==="building"?" · ~"+fmt(s.etaSec)+" left":""}</div>`; };
  try{
    const r=await fetch("/api/build",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dec,oqPolicy,scope,integration})});
    const res=await r.json();
    if(res.running){ upd("A build is already running — streaming its progress…"); }
    else if(!res.started){ upd("⚠ Build failed to start: "+esc(res.error||"unknown")); reset(); return; }
    upd("<b>🔨 Building from spec…</b> scaffolding Angular, installing dependencies, then compiling. This takes a few minutes.");
    const poll=async ()=>{
      let s; try{ s=await (await fetch("/api/build/status",{cache:"no-store"})).json(); }catch(e){ setTimeout(poll,3000); return; }
      const tail=(s.log||[]).slice(-8).join("\n");
      if(s.state==="done"){ upd("<b>✅ Build complete.</b> Opening <a href='/prototype/build/' target='_blank' style='color:var(--accent)'>/prototype/build/</a> in a new tab."+bar(s)+pre(tail)); window.open("/prototype/build/?t="+Date.now(),"_blank"); reset(); return; }
      if(s.state==="error"){ upd("<b>✗ Build failed:</b> "+esc(s.error||"")+bar(s)+pre(tail)); reset(); return; }
      if(s.state==="cancelled"){ upd("<b>⏹ Build cancelled.</b> Environment reset — ready for the next build."+bar(s)+pre(tail)); reset(); return; }
      upd("<b>🔨 Building…</b> "+esc(s.step||s.state||"")+bar(s)+pre(tail));
      setTimeout(poll, 2500);
    };
    poll();
  }catch(e){ upd("⚠ Build failed: "+esc(e.message)); reset(); }
};
document.getElementById("killBtn").onclick=async ()=>{
  const kill=document.getElementById("killBtn"); kill.disabled=true; kill.textContent="⏹ Stopping…";
  try{ await fetch("/api/build/cancel",{method:"POST"}); }catch(e){}
  // the Build poll loop observes state==="cancelled", resets the UI, and re-enables the button.
};

/* ---------- boot ---------- */
(async function(){
  G=EMBED;
  try{ const r=await fetch("new-inventory-entry.json",{cache:"no-store"}); if(r.ok) G=await r.json(); }catch(e){}
  LSKEY="decide:"+G.workflow.id;
  document.getElementById("hdrSub").textContent = G.workflow.name + " → " + TARGET;
  CATS.forEach(c=>c.items(G).forEach(i=>{ if(dec[i.id]==null) dec[i.id]=defaultFor(c,i); }));
  if(SERVED){
    try{ const s=await (await fetch("/api/decisions",{cache:"no-store"})).json(); if(s&&s.dec){ dec=s.dec; oqPolicy=s.oqPolicy||{}; scope=s.scope||{}; integration=s.integration||{}; } }catch(e){}
  } else {
    restore();
  }
  CATS.forEach(c=>c.items(G).forEach(i=>{ if(dec[i.id]==null) dec[i.id]=defaultFor(c,i); }));
  renderRight();
  if(SERVED){
    wireChat();
    addMsg("assistant", capabilityOverview());
    addMsg("assistant","**Where we are — ✅ Phase 1 is built and verified.** The Angular app is published at [/prototype/build/](/prototype/build/) and the write path is proven end-to-end against VADEMO file 6914: pointers, **sub-file** pointers (FUND · BUDGET OBJECT CODE · STANDARD GENERAL LEDGER), set-of-codes, dates, numerics and bounded text all file correctly.\n\n**Phase 2 — IRIS production** is what's open now: the downstream side effects (work order · PM · FA document · bulletin). **Phase 3 — AI Hub** comes after.");
    const pend=blockingList();
    addMsg("assistant", pend.length
      ? `**Still to decide before Phase 2:** ${pend.map((q,i)=>`${i+1}. ${q.decisionPoint}`).join(" · ")}.\n\nFor each one I'll work the same way: **show you what the legacy code actually does** — quoting the MUMPS and breaking a compound condition into its individual parts — **explain it**, and then **you decide how to modernize** each part: keep it, change it, move it to a different layer, or drop it. Nothing is preserved by default, and anything that departs from the legacy gets flagged so the provenance stays trustworthy.\n\nReady to start with the first one?`
      : `**All Phase-2 open questions are decided** — the spec on the right shows exactly what was recorded.`);
    chatHistory.push({role:"assistant",text:`[intro: Phase 1 built+verified; Phase-2 open questions still to decide: ${pend.map(q=>q.id).join(", ")||"none"}; approach = show legacy evidence, explain, developer decides how to modernize each condition]`});
  } else {
    addMsg("assistant","This guided session needs the served workbench (the agent backend). Run it via the node server and open http://localhost:8899/capability-graph/decide.html — the spec on the right still renders from saved decisions.","muted");
  }
})();
