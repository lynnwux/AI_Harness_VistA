<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decide — Legacy Capability → Development Spec</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141b24'/%3E%3Cpath d='M9 16 22 9M9 16 22 23' stroke='%233d9cf5' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='16' r='4.5' fill='%233d9cf5'/%3E%3Ccircle cx='23' cy='9' r='4.5' fill='%237ee787'/%3E%3Ccircle cx='23' cy='23' r='3.8' fill='%2326303d' stroke='%233d9cf5' stroke-width='1.5'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#141b24; --panel2:#1b2430; --edge:#26303d;
    --ink:#e6edf3; --dim:#8b98a5; --faint:#5b6672;
    --accent:#3d9cf5; --accent2:#7ee787; --warn:#f0a020; --question:#ff6b5e; --purple:#bc8cff;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 16px;flex-wrap:wrap;
    background:linear-gradient(180deg,#182029,#10161d);border-bottom:1px solid var(--edge)}
  header .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#3d9cf5,#1f6feb);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px}
  header h1{font-size:14px;margin:0;font-weight:650}
  header .sub{color:var(--dim);font-size:11.5px}
  header .sp{flex:1}
  .btn{background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:7px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--edge)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}

  .stage{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 50px)}
  .pane{min-height:0;overflow-y:auto;padding:14px 16px 60px}
  .pane.left{border-right:1px solid var(--edge)}
  .pane-title{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;
    color:var(--faint);font-weight:700;margin:0 0 12px}
  .pane-title .prog{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--dim);font-size:11px}

  /* categories */
  .cat{margin-bottom:16px}
  .cat-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink);
    padding:6px 0;border-bottom:1px solid var(--edge);margin-bottom:8px}
  .cat-h .ic{font-size:13px}
  .cat-h .n{color:var(--faint);font-weight:600;font-size:11px}
  .cat.oq .cat-h{color:var(--question)}

  .row{background:var(--panel);border:1px solid var(--edge);border-radius:9px;padding:9px 11px;margin-bottom:8px}
  .row.block{border-color:var(--question);box-shadow:0 0 0 1px rgba(255,107,94,.25)}
  .row .lbl{font-size:12.5px;font-weight:600}
  .row .lbl .warni{color:var(--question);margin-right:5px}
  .row .sub{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:2px;word-break:break-word}
  .seg{display:inline-flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .opt{background:var(--panel2);color:var(--dim);border:1px solid var(--edge);border-radius:6px;
    padding:3px 9px;font-size:11px;cursor:pointer;font-family:var(--sans)}
  .opt:hover{color:var(--ink)}
  .opt.active{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
  .cat.oq .opt.active{background:var(--question);border-color:var(--question);color:#1a0d0b}
  .oqp{width:100%;margin-top:8px;background:#0e141b;color:var(--ink);border:1px solid var(--edge);
    border-radius:6px;padding:7px 9px;font-size:12px;font-family:var(--sans);resize:vertical;min-height:34px}
  .oqp::placeholder{color:var(--faint)}
  .hintline{font-size:10.5px;color:var(--faint);margin-top:5px}
  .seg.scope{margin-top:6px}
  .scopt{background:transparent;color:var(--dim);border:1px dashed var(--edge);border-radius:6px;padding:3px 9px;font-size:10.5px;cursor:pointer;font-family:var(--sans)}
  .scopt:hover{color:var(--ink)}
  .scopt.active{background:var(--accent2);border-style:solid;border-color:var(--accent2);color:#04121f;font-weight:700}
  .intbox{margin-top:8px;padding:8px 9px;background:#0e141b;border:1px solid var(--edge);border-left:3px solid var(--purple);border-radius:6px}
  .intbox .intf{width:100%;margin-top:5px;background:#141b24;color:var(--ink);border:1px solid var(--edge);border-radius:5px;padding:5px 8px;font-size:11.5px;font-family:var(--mono)}
  .intbox .intf::placeholder{color:var(--faint)}

  /* spec doc (right) */
  .doc{font-size:12.5px;line-height:1.6}
  .doc h2{font-size:15px;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--edge)}
  .doc h2:first-child{margin-top:0}
  .doc h3{font-size:12.5px;margin:12px 0 5px;color:var(--accent)}
  .doc ul{margin:4px 0 8px;padding-left:18px}
  .doc li{margin-bottom:4px}
  .doc code{font-family:var(--mono);font-size:11.5px;background:#0e141b;border:1px solid var(--edge);border-radius:4px;padding:0 4px;color:#9ecbff}
  .doc pre{background:#0e141b;border:1px solid var(--edge);border-radius:7px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:11px;color:#c9d3dd}
  .doc .block{background:#2a1713;border:1px solid var(--question);border-radius:8px;padding:9px 12px;color:#ffb3aa}
  .doc .ok{color:var(--accent2)}
  .doc .muted{color:var(--faint)}
  .doc mark.hl{background:#3a2f14;color:#f0c040;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;vertical-align:middle;border:1px solid #6b5a1e}

  /* chat assistant (served mode) */
  .chat-fab{position:fixed;right:18px;bottom:18px;z-index:40;display:none;
    background:var(--accent);color:#04121f;border:none;border-radius:22px;padding:10px 16px;
    font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .chat-drawer{position:fixed;right:18px;bottom:18px;z-index:41;width:380px;max-width:calc(100vw - 36px);
    height:520px;max-height:calc(100vh - 90px);display:none;flex-direction:column;
    background:var(--panel);border:1px solid var(--edge);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.55);overflow:hidden}
  .chat-drawer.open{display:flex}
  .chat-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#131b24;border-bottom:1px solid var(--edge)}
  .chat-hd b{font-size:13px}.chat-hd .m{font-size:10px;color:var(--faint);font-family:var(--mono)}
  .chat-hd .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
  .chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  .cmsg{max-width:88%;padding:8px 11px;border-radius:10px;font-size:12.5px;line-height:1.5;white-space:pre-wrap}
  .cmsg.user{align-self:flex-end;background:var(--accent);color:#04121f}
  .cmsg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--edge)}
  .cmsg.muted{color:var(--faint)}
  .chat-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--edge)}
  .chat-in input{flex:1;background:#0e141b;color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:12.5px;font-family:var(--sans)}
  .chat-in button{background:var(--accent);color:#04121f;border:none;border-radius:8px;padding:0 13px;font-weight:700;cursor:pointer}
  .chat-hint{padding:0 12px 8px;font-size:10.5px;color:var(--faint)}
  /* chat-primary left pane */
  .pane.left.chatpane{display:flex;flex-direction:column;padding:0}
  .pane.left.chatpane .pane-title{padding:14px 16px 10px;margin:0;border-bottom:1px solid var(--edge)}
  .agenda{padding:7px 16px;border-bottom:1px solid var(--edge);font-size:11px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;background:#10161d}
  .agenda b{color:var(--ink);font-weight:700}
  .agenda .blk{color:var(--question);font-weight:700}
  .agenda .rdy{color:var(--accent2);font-weight:700}
  .chatpane .chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:#0a0e14}
  .chatpane .chat-in{padding:12px 14px;background:#10161d}
  .cmsg{max-width:90%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .cmsg::before{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
  .cmsg.user{align-self:flex-end;background:linear-gradient(180deg,#4aa6ff,#2b8ae6);color:#04121f}
  .cmsg.user::before{content:"You";color:#053; opacity:.55}
  .cmsg.assistant{align-self:flex-start;background:#1f2b3a;border:1px solid #3d5170;border-left:3px solid var(--accent);color:#f0f6fc}
  .cmsg.assistant::before{content:"Assistant";color:#66d9ff}
  .cmsg.muted{background:transparent;border:none;box-shadow:none;color:var(--faint);font-size:12px}
  .cmsg.muted::before{content:""}
  .cmsg b{color:#fff}
  .cmsg.user b{color:#001b33}
  .cmsg code{font-family:var(--mono);font-size:11.5px;background:#0a0e14;border:1px solid #3d5170;border-radius:4px;padding:0 4px;color:#9ecbff}
  .cmsg.user code{background:rgba(0,0,0,.18);border-color:transparent;color:#001b33}
  .cmsg{position:relative}
  .ttsbtn{position:absolute;top:6px;right:8px;background:transparent;border:none;cursor:pointer;font-size:12px;opacity:.5;padding:0;line-height:1}
  .ttsbtn:hover{opacity:1}
  .vsel{max-width:200px;font-size:11.5px;padding:6px 8px;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:7px;cursor:pointer}
  .voicebar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--edge)}
  .voicebar .btn{font-size:11.5px;padding:5px 10px}
  .cmsg.speaking{outline:2px solid var(--accent2);outline-offset:1px}
  .tabs{display:flex;align-items:center;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .tab{background:var(--panel2);color:var(--dim);border:1px solid var(--edge);border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#04121f}
  .tabs .sp{flex:1}
  .specerr{background:#2a1713;border:1px solid var(--question);border-radius:8px;padding:9px 12px;color:#ffb3aa;margin-bottom:10px}
  .reccard{align-self:stretch;background:#10221a;border:1px solid #2f6b4a;border-left:3px solid var(--accent2);border-radius:10px;padding:8px 12px;font-size:12px}
  .reccard .rh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--accent2);margin-bottom:4px}
  .reccard .rr{margin:3px 0;line-height:1.45}
  .reccard .was{color:var(--faint);text-decoration:line-through}
  .reccard .now{color:#d6ffe4}
  .evcard{align-self:stretch;background:#141c2a;border:1px solid #33465f;border-left:3px solid var(--warn);border-radius:10px;padding:8px 12px;font-size:11.5px}
  .evcard .eh{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--warn);margin:4px 0}
  .evcard .el{font-family:var(--mono);color:#c9d3dd;margin:2px 0;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="logo">SE</div>
  <div><h1>Decide — Legacy Capability → Development Spec</h1><div class="sub" id="hdrSub">—</div></div>
  <div class="sp"></div>
  <button class="btn" title="Open the Layer Map (legacy ↔ target)" onclick="window.open('map.html','_blank')">🔗 Layer Map</button>
</header>

<div class="stage">
  <div class="pane left chatpane">
    <div class="pane-title">Guided decision session <span class="prog" id="prog"></span></div>
    <div class="voicebar"><button class="btn" id="voiceBtn" title="Read assistant messages aloud">🔇 Voice off</button><select class="vsel" id="voiceSel" title="Choose a voice"></select></div>
    <div class="agenda" id="agenda"></div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-in"><input id="chatInp" placeholder="Answer, ask, or instruct…" autocomplete="off"><button id="chatSend">Send</button></div>
  </div>
  <div class="pane right">
    <div class="tabs">
      <button class="tab" data-layer="api">API</button>
      <button class="tab" data-layer="orchestrator">Orchestrator</button>
      <button class="tab" data-layer="ai">AI</button>
      <span class="sp"></span>
      <button class="btn" id="dlBtn" title="Download this layer's spec">⬇ Download</button>
      <button class="btn primary" id="buildBtn" title="Regenerate the API layer (Angular app) from the API spec and open it">🔨 Build</button>
      <button class="btn" id="killBtn" title="Cancel the running build and reset the environment for the next one" disabled>⏹ Stop</button>
      <button class="btn" id="irisBtn" title="Open the built production in the IRIS Management Portal" style="display:none">🔗 Open in IRIS</button>
      <button class="btn primary" id="prodBtn" title="Generate the IRIS production from the orchestrator spec, deploy it and verify it with one dry-run request">🔨 Build production</button>
      <button class="btn primary" id="aiBtn" title="Generate the AI layer from the AI spec, deploy it to IRIS and verify it against VistA" style="display:none">🔨 Build AI</button>
      <button class="btn" id="chatAppBtn" title="Open the chat app" style="display:none">💬 Open chat app</button>
    </div>
    <div class="doc" id="doc"></div>
  </div>
</div>

<script>
const cap = g => g.capabilities[0];
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// Validate a server-supplied chat URL: must start with "/" (not "//") and contain
// no quotes, backslashes, angle brackets, whitespace or control characters.
// Falls back to the given fallback (or "/prototype/chat/") for anything else,
// blocking javascript: URIs, protocol-relative URLs and attribute injection.
function safeChatUrl(url, fallback){
  const s = String(url == null ? "" : url);
  if(/^\/(?!\/)/.test(s) && !/["'`\\<>\s\x00-\x1f]/.test(s)) return s;
  return fallback || "/prototype/chat/";
}
const TARGET = "RegisterEquipment";
let G = null, SPECS = null, TAB = "orchestrator", PORTAL = null;
let AI_CHAT_URL = null, AI_BUILT = false, AI_STATUS_JSON = true;
// A server started before the AI layer was added answers /api/build/ai/status with an HTML page and serves the
// old AI placeholder spec; the page then asks for a restart instead of failing in odd ways.
const OLD_SERVER_NOTICE = "This page is newer than the running workbench server — restart the workbench server (npm start) in agent/ to load the AI layer.";
function serverLooksOld(specs, aiStatusIsJson){
  if(aiStatusIsJson===false) return true;
  if(!specs||!specs.layers) return false;            // unreachable or failed: shown by its own message
  const ai=specs.layers.ai;
  if(!ai) return true;
  return (ai.missing||[]).some(m=>m.kind==="design") || !/^# AI layer spec — Equipment inventory chatbot/.test(ai.md||"");
}
// The tab the page opens on: the layer the stage is working on.
function defaultTab(specs){ return specs&&specs.stage&&specs.stage.layer==="ai" ? "ai" : "orchestrator"; }
// the last successful production build's Management Portal page, if any
async function loadPortal(){
  try{ const s=await (await fetch("/api/build/production/status",{cache:"no-store"})).json(); PORTAL = s.state==="done" ? s.portalUrl||null : PORTAL; }catch(e){}
  renderRight();
}
// the last successful AI build's chat URL, if any
async function loadAiStatus(){
  try{
    const text=await (await fetch("/api/build/ai/status",{cache:"no-store"})).text();
    let s=null; try{ s=JSON.parse(text); AI_STATUS_JSON=true; }catch(e){ AI_STATUS_JSON=false; }
    if(s&&s.state==="done"){ AI_CHAT_URL=safeChatUrl(s.chatUrl,"/prototype/chat/"); AI_BUILT=true; }
  }catch(e){}
  renderRight();
}

async function loadSpecs(){
  try{ const r=await fetch("/api/specs",{cache:"no-store"}); SPECS=await r.json(); }
  catch(e){ SPECS={error:"Could not reach the workbench server: "+e.message}; }
  renderRight();
}
function updateProg(){
  if(!G||!SPECS||!SPECS.layers) return;
  const n=(cap(G).openQuestions||[]).length, open=SPECS.layers.orchestrator.missing.filter(m=>m.kind==="decide").length;
  document.getElementById("prog").textContent=`${n-open}/${n} open questions decided`;
}
function wireTabs(){
  document.querySelectorAll(".tab").forEach(b=>{ b.onclick=()=>{ TAB=b.dataset.layer; renderRight(); }; });
}

/* tiny markdown -> html */
function mdToHtml(md){
  const lines=md.split("\n"); let h="", inUl=false, inPre=false;
  const closeUl=()=>{ if(inUl){h+="</ul>";inUl=false;} };
  const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/==([^=]+)==/g,'<mark class="hl">$1</mark>');
  lines.forEach(ln=>{
    if(ln.trim()==="```"){ if(inPre){h+="</pre>";inPre=false;} else {closeUl();h+="<pre>";inPre=true;} return; }
    if(inPre){ h+=esc(ln)+"\n"; return; }
    if(ln.startsWith("### ")){ closeUl(); h+=`<h3>${inline(ln.slice(4))}</h3>`; return; }
    if(ln.startsWith("## ")){ closeUl(); h+=`<h2>${inline(ln.slice(3))}</h2>`; return; }
    if(ln.startsWith("# ")){ closeUl(); h+=`<h2 style="font-size:17px">${inline(ln.slice(2))}</h2>`; return; }
    if(ln.startsWith("- ")||ln.startsWith("  - ")){ if(!inUl){h+="<ul>";inUl=true;} const ind=ln.startsWith("  - "); h+=`<li${ind?' style="margin-left:16px"':''}>${inline(ln.replace(/^\s*- /,""))}</li>`; return; }
    closeUl();
    if(ln.trim()===""){ h+=""; return; }
    if(ln.startsWith("🚫")||ln.startsWith("Source:")){ h+=`<p class="muted">${inline(ln)}</p>`; return; }
    h+=`<p>${inline(ln)}</p>`;
  });
  closeUl(); if(inPre)h+="</pre>";
  // highlight blocking header section
  return h;
}
function renderRight(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.layer===TAB));
  const onApi = TAB==="api";
  document.getElementById("buildBtn").style.display = onApi ? "" : "none";
  document.getElementById("killBtn").style.display = onApi ? "" : "none";
  const prod=document.getElementById("prodBtn"), oDone=SPECS&&SPECS.layers&&SPECS.layers.orchestrator.complete;
  prod.style.display = TAB==="orchestrator" ? "" : "none";
  document.getElementById("irisBtn").style.display = TAB==="orchestrator" && PORTAL ? "" : "none";
  if(!prod.dataset.busy){ prod.disabled=!oDone; prod.title=oDone?"Generate the IRIS production from the orchestrator spec, deploy it and verify it with one dry-run request":"Finish the orchestrator spec's missing items in the chat first"; }
  const aiBtn=document.getElementById("aiBtn"), chatAppBtn=document.getElementById("chatAppBtn");
  const aDone=SPECS&&SPECS.layers&&SPECS.layers.ai&&SPECS.layers.ai.complete;
  aiBtn.style.display = TAB==="ai" ? "" : "none";
  chatAppBtn.style.display = TAB==="ai" && AI_BUILT ? "" : "none";
  if(!aiBtn.dataset.busy){ aiBtn.disabled=!aDone; aiBtn.title=aDone?"Generate the AI layer from the AI spec, deploy it to IRIS and verify it against VistA":"Finish the AI spec's missing items in the Decide chat first"; }
  const doc=document.getElementById("doc");
  if(!SPECS||!SPECS.layers){ doc.innerHTML=`<div class="specerr">${esc((SPECS&&SPECS.error)||"Specs not available")}</div>`; return; }
  const banner = (serverLooksOld(SPECS, AI_STATUS_JSON) ? `<div class="specerr">⚠ ${esc(OLD_SERVER_NOTICE)}</div>` : "")
    + (SPECS.notice ? `<div class="specerr">⚠ ${esc(SPECS.notice)}</div>` : "")
    + (SPECS.error ? `<div class="specerr">⚠ Spec generation failed — showing the last good version. ${esc(SPECS.error)}</div>` : "");
  doc.innerHTML = banner + mdToHtml(SPECS.layers[TAB].md);
  updateProg(); updateAgenda();
}
function updateAgenda(){
  const el=document.getElementById("agenda"); if(!el||!SPECS||!SPECS.layers) return;
  const a=SPECS.layers.api, o=SPECS.layers.orchestrator;
  const unmet=o.needs.filter(n=>!n.met).length;
  el.innerHTML =
    `<span>API <b>${a.owns.built.length}</b> services built · ${a.owns.proposed.length} proposed</span>`
    + `<span>Orchestrator ${o.complete?'<span class="rdy">✓ ready to build</span>':`<b>${o.missing.length}</b> items missing${unmet?` · <span class="blk">${unmet} unmet need${unmet>1?"s":""}</span>`:""}`}</span>`
    + (()=>{ const ai=SPECS.layers.ai; return ai?`<span>AI ${AI_BUILT?'<span class="rdy">built ✓</span>':ai.complete?'<span class="rdy">ready to build</span>':`<b>${(ai.missing||[]).length}</b> items missing`}</span>`:'<span>AI <b>not available</b></span>'; })();
}
/* natural-language explanation of the capability graph — the orientation before deciding */
function capabilityOverview(){
  const c=cap(G), w=G.workflow;
  const fileNode=(c.data||[]).find(d=>d.file); const file=fileNode?fileNode.file:"6914";
  const entryScreens=(c.formScreens||[]).filter(s=>s.fields&&s.fields.length);
  const screens=entryScreens.length;
  const fields=entryScreens.reduce((n,s)=>n+s.fields.length,0) || (c.data||[]).filter(d=>d.kind==="field").length;
  const beh=(c.sideEffects||[]); const oqs=(c.openQuestions||[]);
  const sfx=beh.map(b=>b.name).join(", ");
  const menu=(w.menuPath||[]).join(" ▸ ");
  const paras=[];
  paras.push(`**What we're building: \`${TARGET}\`** — the modern version of the legacy **${w.name}** option (routine \`${c.entryPoint?c.entryPoint.dispatch:""}\`, FileMan file ${file}).`+(menu?` Discovered by tracing ${menu}.`:""));
  if(c.summary) paras.push(c.summary);
  paras.push(`In plain terms: a clerk fills a **${screens}-screen form (${fields} fields)**; on save the record is created in file ${file} with its serial-number duplicate check preserved. The entry also triggers **${beh.length} downstream side effects** — ${sfx}.`);
  paras.push(`The right pane shows the spec for each layer — **API** (REST service on VistA + Angular app) · **Orchestrator** (IRIS Interoperability production) · **AI** (AI Hub) — and it renders live. **What you decide in this chat is what gets built:** every decision is recorded, the specs regenerate on the spot, and each build reads its layer's spec. Most of the capability is coded in the legacy and carries over; the legacy leaves **${oqs.length} decisions to a human**, plus how each side effect is wired. Let's settle those.`);
  return paras.join("\n\n");
}

/* the opening messages after the overview: where the build is, and what is next — driven by the stage */
function openingMessages(specs){
  if(!specs||!specs.layers) return ["⚠ The layer specs could not be generated — see the right pane."];
  const st=specs.stage||{};
  if(st.layer==="ai"){
    const ai=specs.layers.ai, miss=(ai&&ai.missing)||[];
    const where="**Where we are — ✅ Phase 1 and the production are built and verified.** The Angular app is published at [/prototype/build/](/prototype/build/), and the IRIS production (the orchestrator layer) is built and verified.\n\nWe're working on the **AI** layer now — the equipment inventory chatbot on IRIS AI Hub; its spec is on the AI tab.";
    const next = st.step==="done" ? "**The AI layer is built and verified.** Open the chat app from the AI tab (💬 Open chat app). To change a quick-access question, tell me here, then press 🔨 Build AI again."
      : st.step==="ready" ? "**The AI spec is complete** — ready for 🔨 Build AI on the AI tab."
      : st.step==="discovery" ? "⚠ The inventory discovery file (capability-graph/inventory-fields.json) is missing — run the discovery step (agent/discover-inventory.js) before designing the AI layer."
      : `**Still to decide for the AI layer (${miss.length}):** ${miss.slice(0,6).map((m,i)=>`${i+1}. ${m.what}`).join(" · ")}${miss.length>6?" · …":""}.\n\nI'll take the quick-access questions one at a time — keep or drop, the wording, then each parameter — showing the legacy field meanings as evidence and asking you for every value; I never propose one. After each decision a card shows exactly what was recorded.\n\nReady to start with the first one?`;
    return [where, next];
  }
  const o=specs.layers.orchestrator;
  const pend=o.missing.filter(m=>m.kind==="decide");
  const where="**Where we are — ✅ Phase 1 is built and verified.** The Angular app is published at [/prototype/build/](/prototype/build/) and the write path is proven end-to-end against VADEMO file 6914.\n\nWe're working on the **Orchestrator** layer (the IRIS production) now; **AI** comes after the production is built and verified.";
  const next = pend.length ? `**Still to decide for the orchestrator layer:** ${pend.map((m,i)=>`${i+1}. ${m.what.replace(/^decide: /,"")}`).join(" · ")}.\n\nFor each one I'll work the same way: **show you what the legacy code actually does** — quoting the MUMPS and breaking a compound condition into its individual parts — **explain it**, and then **you decide how to modernize** each part: keep it, change it, move it to a different layer, or drop it. Anything that departs from the legacy gets flagged, and after each decision a card shows exactly what was recorded.\n\nReady to start with the first one?`
    : o.complete ? "**The orchestrator spec is complete** — ready for the production build."
    : `**The open questions are decided.** Next: ${(st.next&&(st.next.what||st.next.service))||""}`;
  return [where, next];
}

/* ---------- state + events ---------- */
const SERVED = location.protocol === "http:" || location.protocol === "https:";

/* ---- chat assistant (served mode) ---- */
let chatHistory=[];
function fmtMsg(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>"); }

/* ---------- text-to-speech (Web Speech API) ---------- */
let voiceOn = false;   // off until the user turns it on with the Voice button
function stripForSpeech(t){
  return String(t)
    .replace(/```[\s\S]*?```/g," (code) ")
    .replace(/[*_`#>|]/g,"")
    .replace(/[①②③④⑤⑥⑦⑧⑨]/g,"")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu," ")
    .replace(/[→▸·•]/g," , ")
    .replace(/\s+/g," ").trim();
}
let speakingEl=null, voices=[], chosenVoice=null;
function scoreVoice(v){
  let s=0; const n=(v.name||"").toLowerCase();
  if(/^en/i.test(v.lang)) s+=3;
  if(/natural|neural|online/.test(n)) s+=6;      // MS Edge neural voices
  if(/google/.test(n)) s+=4;                      // Chrome's cloud voice
  if(/aria|jenny|guy|ana|michelle|siri|samantha|serena|zoe/.test(n)) s+=3;
  if(/david|zira|mark|hazel|espeak|pico/.test(n)) s-=3;  // old robotic
  if(v.localService===false) s+=1;                // cloud usually nicer
  return s;
}
function loadVoices(){
  voices=(window.speechSynthesis?speechSynthesis.getVoices():[])||[];
  const sel=document.getElementById("voiceSel"); if(!sel) return;
  if(!voices.length){ sel.innerHTML='<option>loading voices…</option>'; return; }
  const english=voices.filter(v=>/^en/i.test(v.lang));
  const ranked=(english.length?english:voices).map((v,i)=>({v,i,s:scoreVoice(v)})).sort((a,b)=>b.s-a.s).slice(0,4);
  const saved=localStorage.getItem("decideVoice");
  chosenVoice = (ranked.find(({v})=>v.name===saved)||ranked[0]).v;
  sel.innerHTML=ranked.map(({v})=>`<option value="${esc(v.name)}" ${v.name===chosenVoice.name?"selected":""}>${esc(v.name)}${/natural|neural|online|google/i.test(v.name)?" ★":""}</option>`).join("");
}
function speak(text, el, force){
  if((!voiceOn && !force) || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    if(speakingEl) speakingEl.classList.remove("speaking");
    const u=new SpeechSynthesisUtterance(stripForSpeech(text)); u.rate=1.03; u.pitch=1.0;
    if(chosenVoice){ u.voice=chosenVoice; u.lang=chosenVoice.lang; }
    if(el){ speakingEl=el; el.classList.add("speaking"); u.onend=u.onerror=()=>el.classList.remove("speaking"); }
    speechSynthesis.speak(u);
  }catch(e){}
}
function addMsg(role,text,cls){
  const box=document.getElementById("chatMsgs");
  const d=document.createElement("div"); d.className="cmsg "+role+(cls?(" "+cls):"");
  if(role==="assistant"&&!cls){
    d.innerHTML=fmtMsg(text);
    const rb=document.createElement("button"); rb.className="ttsbtn"; rb.title="Play aloud"; rb.textContent="🔊";
    rb.onclick=()=>speak(text,d,true); d.appendChild(rb);
    if(voiceOn) speak(text,d);
  } else { d.textContent=text; }
  box.appendChild(d); box.scrollTop=box.scrollHeight; return d;
}
const fmtVal = v => v==null||v==="" ? "(none)" : typeof v==="object" ? JSON.stringify(v) : String(v);
function addRecordedCards(list){
  if(!list||!list.length) return;
  const box=document.getElementById("chatMsgs");
  const d=document.createElement("div"); d.className="reccard";
  d.innerHTML=`<div class="rh">Recorded</div>`+list.map(c=>`<div class="rr"><b>${esc(c.label)}</b> · <code>${esc(c.field)}</code><br><span class="was">${esc(fmtVal(c.before))}</span> → <span class="now">${esc(fmtVal(c.after))}</span></div>`).join("");
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
// Evidence card: the graph's own evidence for the item the reply is about, shown beside the chat's words.
function addEvidenceCard(list){
  if(!list||!list.length) return;
  const box=document.getElementById("chatMsgs");
  const d=document.createElement("div"); d.className="evcard";
  d.innerHTML=list.map(e=>`<div class="eh">Legacy evidence — ${esc(e.names.join(" / "))}</div>`+e.lines.map(l=>`<div class="el">${esc(l)}</div>`).join("")).join("");
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
let chatBusy=false;   // one turn at a time — a second message waits until the reply and its cards are in
async function sendChat(){
  const inp=document.getElementById("chatInp"), send=document.getElementById("chatSend");
  const msg=inp.value.trim(); if(!msg||chatBusy) return;
  chatBusy=true; send.disabled=true;
  inp.value=""; addMsg("user",msg); const prior=chatHistory.slice(); chatHistory.push({role:"user",text:msg});
  const pending=addMsg("assistant","…","muted");
  try{
    const r=await fetch("/api/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,history:prior})});
    const res=await r.json(); pending.remove();
    if(res.error){ addMsg("assistant","⚠ "+res.error); addRecordedCards(res.recorded); await loadSpecs(); return; }
    addMsg("assistant",res.reply); chatHistory.push({role:"assistant",text:res.reply});
    addEvidenceCard(res.evidence); addRecordedCards(res.recorded); await loadSpecs();
  }catch(e){ pending.remove(); addMsg("assistant","⚠ "+e.message); }
  finally{ chatBusy=false; send.disabled=false; }
}
function wireChat(){
  document.getElementById("chatSend").onclick=sendChat;
  document.getElementById("chatInp").addEventListener("keydown",e=>{ if(e.key==="Enter") sendChat(); });
  const vb=document.getElementById("voiceBtn");
  if(!('speechSynthesis' in window)){ vb.disabled=true; vb.textContent="🔇 (no TTS)"; voiceOn=false; return; }
  const showVoice=()=>{ vb.textContent=voiceOn?"🔊 Voice on":"🔇 Voice off"; vb.title=voiceOn?"Stop reading assistant messages aloud":"Read assistant messages aloud"; vb.classList.toggle("primary",voiceOn); };
  vb.onclick=()=>{ voiceOn=!voiceOn; if(!voiceOn){ speechSynthesis.cancel(); if(speakingEl)speakingEl.classList.remove("speaking"); } showVoice(); };
  showVoice();
  loadVoices();
  try{ speechSynthesis.addEventListener("voiceschanged",loadVoices); }catch(e){}
  if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
  // getVoices() is async in some browsers — retry until the list populates
  let vtries=0; const viv=setInterval(()=>{ loadVoices(); if(voices.length || ++vtries>12) clearInterval(viv); },300);
  const sel=document.getElementById("voiceSel");
  sel.onchange=()=>{ chosenVoice=voices.find(v=>v.name===sel.value)||chosenVoice; if(chosenVoice) localStorage.setItem("decideVoice",chosenVoice.name); speak("Voice set to "+ (chosenVoice?chosenVoice.name:"default")+".", null, true); };
}
document.getElementById("dlBtn").onclick=()=>{
  if(!SPECS||!SPECS.layers) return;
  const blob=new Blob([SPECS.layers[TAB].md],{type:"text/markdown"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=TAB+".md"; a.click();
};
document.getElementById("buildBtn").onclick=async ()=>{
  const btn=document.getElementById("buildBtn"); const kill=document.getElementById("killBtn"); const label=btn.textContent;
  const reset=()=>{ btn.textContent=label; btn.disabled=false; kill.disabled=true; kill.textContent="⏹ Stop"; };
  btn.textContent="🔨 Building…"; btn.disabled=true; kill.disabled=false;
  // a live progress bubble (created manually so it isn't auto-spoken on every poll tick)
  const boxEl=document.getElementById("chatMsgs");
  const bubble=document.createElement("div"); bubble.className="cmsg assistant"; boxEl.appendChild(bubble);
  const upd=(html)=>{ bubble.innerHTML=html; boxEl.scrollTop=boxEl.scrollHeight; };
  const pre=(t)=>`<pre style="margin-top:6px;max-height:170px;overflow:auto;background:#0a0e14;border:1px solid var(--edge);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap">${esc(t)}</pre>`;
  const fmt=(n)=>{ n=Math.max(0,Math.round(n||0)); const m=Math.floor(n/60), s=n%60; return m?(m+"m "+s+"s"):(s+"s"); };
  const bar=(s)=>{ const pct=Math.round(s.pct||0); return `<div style="background:#26303d;border-radius:6px;height:12px;margin:8px 0;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent2);transition:width .5s"></div></div><div style="font-size:11px;color:var(--dim)">${pct}%${s.elapsedSec!=null?" · "+fmt(s.elapsedSec)+" elapsed":""}${s.etaSec!=null&&s.state==="building"?" · ~"+fmt(s.etaSec)+" left":""}</div>`; };
  try{
    const r=await fetch("/api/build",{method:"POST"});
    const res=await r.json();
    if(res.running){ upd("A build is already running — streaming its progress…"); }
    else if(!res.started){ upd("⚠ Build failed to start: "+esc(res.error||"unknown")); reset(); return; }
    upd("<b>🔨 Building the API layer from its spec…</b> scaffolding Angular, installing dependencies, then compiling. This takes a few minutes.");
    const poll=async ()=>{
      let s; try{ s=await (await fetch("/api/build/status",{cache:"no-store"})).json(); }catch(e){ setTimeout(poll,3000); return; }
      const tail=(s.log||[]).slice(-8).join("\n");
      if(s.state==="done"){ upd("<b>✅ Build complete.</b> Opening <a href='/prototype/build/' target='_blank' style='color:var(--accent)'>/prototype/build/</a> in a new tab."+bar(s)+pre(tail)); window.open("/prototype/build/?t="+Date.now(),"_blank"); reset(); return; }
      if(s.state==="error"){ upd("<b>✗ Build failed:</b> "+esc(s.error||"")+bar(s)+pre(tail)); reset(); return; }
      if(s.state==="cancelled"){ upd("<b>⏹ Build cancelled.</b> Environment reset — ready for the next build."+bar(s)+pre(tail)); reset(); return; }
      upd("<b>🔨 Building…</b> "+esc(s.step||s.state||"")+bar(s)+pre(tail));
      setTimeout(poll, 2500);
    };
    poll();
  }catch(e){ upd("⚠ Build failed: "+esc(e.message)); reset(); }
};
document.getElementById("prodBtn").onclick=async ()=>{
  const btn=document.getElementById("prodBtn"), label="🔨 Build production";
  const reset=()=>{ btn.textContent=label; delete btn.dataset.busy; btn.disabled=false; loadSpecs(); };
  btn.textContent="🔨 Building…"; btn.disabled=true; btn.dataset.busy="1";
  const boxEl=document.getElementById("chatMsgs");
  const bubble=document.createElement("div"); bubble.className="cmsg assistant"; boxEl.appendChild(bubble);
  const upd=(html)=>{ bubble.innerHTML=html; boxEl.scrollTop=boxEl.scrollHeight; };
  const pre=(t)=>`<pre style="margin-top:6px;max-height:220px;overflow:auto;background:#0a0e14;border:1px solid var(--edge);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap">${esc(t)}</pre>`;
  try{
    const r=await fetch("/api/build/production",{method:"POST"}); const res=await r.json();
    if(res.running){ upd("A production build is already running — streaming its progress…"); }
    else if(!res.started){ upd("⚠ The production build did not start: "+esc(res.error||"unknown")+(res.missing?pre(res.missing.join("\n")):"")); reset(); return; }
    else upd("<b>🔨 Building the IRIS production from the orchestrator spec…</b>");
    const poll=async ()=>{
      let s; try{ s=await (await fetch("/api/build/production/status",{cache:"no-store"})).json(); }catch(e){ setTimeout(poll,3000); return; }
      const log=(s.log||[]).join("\n");
      if(s.state==="done"){
        const b=s.bulletin; PORTAL=s.portalUrl||null;
        const sent=s.result&&s.result.outcomes&&s.result.outcomes.bulletin==="sent";
        upd((sent
            ? "<b>✅ Production running and verified — the bulletin email was sent.</b> Nothing was filed in VistA (that write is still dry-run); the stubs stayed unwired."
              + (s.mail?` <a href="${esc(s.mail.link)}" target="_blank" rel="noopener" style="color:var(--accent)">📧 Open the delivered email</a>`:"")
            : "<b>✅ Production running and verified (dry-run).</b> Nothing was filed in VistA and no email was sent; the stubs stayed unwired.")
          + (PORTAL?` <a href="${esc(PORTAL)}" target="_blank" rel="noopener" style="color:var(--accent)">🔗 Open it in IRIS</a>`:"")
          + (b?"<div style='margin-top:6px'>The bulletin it "+(sent?"sent":"composed")+" (to "+esc(b.Recipients)+"):</div>"+pre(b.Subject+"\n\n"+b.Body):"")
          + pre(log)); reset(); return;
      }
      if(s.state==="error"){ upd("<b>✗ Production build failed:</b> "+esc(s.error||"")+pre(log)); reset(); return; }
      upd("<b>🔨 Building the production…</b> "+esc(s.step||s.state||"")+pre(log));
      setTimeout(poll,2000);
    };
    poll();
  }catch(e){ upd("⚠ Production build failed: "+esc(e.message)); reset(); }
};
document.getElementById("irisBtn").onclick=()=>{ if(PORTAL) window.open(PORTAL,"_blank","noopener"); };
document.getElementById("chatAppBtn").onclick=()=>{ if(AI_CHAT_URL) window.open(AI_CHAT_URL,"_blank","noopener"); };
document.getElementById("aiBtn").onclick=async ()=>{
  const btn=document.getElementById("aiBtn"), label="🔨 Build AI";
  const reset=()=>{ btn.textContent=label; delete btn.dataset.busy; btn.disabled=false; loadSpecs(); };
  btn.textContent="🔨 Building…"; btn.disabled=true; btn.dataset.busy="1";
  const boxEl=document.getElementById("chatMsgs");
  const bubble=document.createElement("div"); bubble.className="cmsg assistant"; boxEl.appendChild(bubble);
  const upd=(html)=>{ bubble.innerHTML=html; boxEl.scrollTop=boxEl.scrollHeight; };
  const pre=(t)=>`<pre style="margin-top:6px;max-height:220px;overflow:auto;background:#0a0e14;border:1px solid var(--edge);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap">${esc(t)}</pre>`;
  const vtbl=(verification)=>{
    if(!verification||!verification.length) return "";
    const rows=verification.map(v=>`<tr><td style="padding:3px 8px;border-bottom:1px solid var(--edge)">${esc(v.question)}</td><td style="padding:3px 8px;border-bottom:1px solid var(--edge)">${esc(v.chatbot)}</td><td style="padding:3px 8px;border-bottom:1px solid var(--edge)">${esc(v.vista)}</td><td style="padding:3px 8px;border-bottom:1px solid var(--edge);color:${v.ok?"var(--accent2)":"var(--question)"}">${v.ok?"✓":"✗"}</td></tr>`).join("");
    return `<table style="margin-top:8px;border-collapse:collapse;font-size:11px;width:100%"><thead><tr><th style="text-align:left;padding:3px 8px;color:var(--dim)">Question</th><th style="text-align:left;padding:3px 8px;color:var(--dim)">Chatbot</th><th style="text-align:left;padding:3px 8px;color:var(--dim)">VistA</th><th style="text-align:left;padding:3px 8px;color:var(--dim)">✓/✗</th></tr></thead><tbody>${rows}</tbody></table>`;
  };
  try{
    const r=await fetch("/api/build/ai",{method:"POST"}); const res=await r.json();
    if(res.running){ upd("An AI build is already running — streaming its progress…"); }
    else if(!res.started){ upd("⚠ The AI build did not start: "+esc(res.error||"unknown")+(res.missing?pre(res.missing.join("\n")):"")); reset(); return; }
    else upd("<b>🔨 Building the AI layer from the AI spec…</b>");
    const poll=async ()=>{
      let s; try{ s=await (await fetch("/api/build/ai/status",{cache:"no-store"})).json(); }catch(e){ setTimeout(poll,3000); return; }
      const log=(s.log||[]).join("\n");
      if(s.state==="done"){
        AI_CHAT_URL=safeChatUrl(s.chatUrl,"/prototype/chat/"); AI_BUILT=true;
        // Build the anchor with DOM APIs — href assignment is browser-validated,
        // preventing any residual XSS even if safeChatUrl were somehow bypassed.
        const chatA=document.createElement("a");
        chatA.href=AI_CHAT_URL; chatA.target="_blank"; chatA.rel="noopener";
        chatA.style.color="var(--accent)"; chatA.textContent="💬 Open the chat app";
        bubble.innerHTML="<b>✅ AI layer built and verified.</b>"+vtbl(s.verification)+" ";
        bubble.appendChild(chatA);
        bubble.insertAdjacentHTML("beforeend",pre(log));
        boxEl.scrollTop=boxEl.scrollHeight;
        renderRight(); reset(); return;
      }
      if(s.state==="error"){ upd("<b>✗ AI build failed:</b> "+esc(s.error||"")+vtbl(s.verification)+pre(log)); reset(); return; }
      upd("<b>🔨 Building the AI layer…</b> "+esc(s.step||s.state||"")+pre(log));
      setTimeout(poll,2000);
    };
    poll();
  }catch(e){ upd("⚠ AI build failed: "+esc(e.message)); reset(); }
};
document.getElementById("killBtn").onclick=async ()=>{
  const kill=document.getElementById("killBtn"); kill.disabled=true; kill.textContent="⏹ Stopping…";

/* ---------- boot ---------- */
(async function(){
  try{ const r=await fetch("new-inventory-entry.json",{cache:"no-store"}); G=await r.json(); }
  catch(e){ document.getElementById("doc").innerHTML='<div class="specerr">Could not load the capability graph — run the workbench server and open http://localhost:8899/capability-graph/decide.html</div>'; return; }

  wireTabs(); wireChat();

  addMsg("assistant", capabilityOverview());
  for(const m of openingMessages(SPECS)) addMsg("assistant", m);

  const pend=SPECS&&SPECS.layers ? (layer==="ai" ? SPECS.layers.ai.missing : SPECS.layers.orchestrator.missing.filter(m=>m.kind==="decide")) : [];
  chatHistory.push({role:"assistant",text:`[intro: ${layer==="ai"?"Phase 1 and the production built+verified; working on the AI layer":"Phase 1 built+verified; working on the orchestrator"}; stage=${st?st.layer+"/"+st.step:"unknown"}; still to decide: ${pend.map(m=>m.id||m.what).join(", ")||"none"}; approach = show legacy evidence, explain, developer decides]`});
})();
